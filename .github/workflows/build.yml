name: Build BrainVault Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Move Files into www & Setup Capacitor
        run: |
          mkdir -p www
          cp -f app.js www/ 2>/dev/null || true
          cp -f style.css www/ 2>/dev/null || true
          cp -rf data www/ 2>/dev/null || true
          rm -rf android node_modules package.json package-lock.json capacitor.config.json
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capacitor-community/admob@6.0.0 @capacitor/share@6.0.0
          npx cap init "BrainVault 10K" "com.brainvault.raretrivia10k" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add AdMob App ID & Internet Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n<application/' $MANIFEST
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5317235020851620~9004631084"\/><\/application>/' $MANIFEST

      - name: Build & Sign APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          keytool -genkey -v -keystore test.keystore -alias brainvault -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=BrainVault, OU=Dev, O=App, L=City, S=State, C=US"
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BUILD_TOOLS/apksigner sign --ks test.keystore --ks-key-alias brainvault --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --out BrainVault-10K-Signed.apk aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrainVault-10K-Signed-APK
          path: BrainVault-10K-Signed.apk
          
